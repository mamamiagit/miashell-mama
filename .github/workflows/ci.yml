name: PowerShell compatibility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7 tests
        shell: pwsh
        run: |
          ./Tests/Run.Tests.ps1
          ./Tests/UI.Smoke.ps1
          ./Tests/Recommendation.Tests.ps1
          ./Tests/Engine.Tests.ps1
          ./Tests/Transactions.Tests.ps1
          ./Tests/Performance.Tests.ps1
      - name: Dashboard preview
        shell: pwsh
        run: ./Start.ps1 -Preview
      - name: Windows PowerShell 5.1 tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./Tests/Run.Tests.ps1
          ./Tests/UI.Smoke.ps1
          ./Tests/Recommendation.Tests.ps1
          ./Tests/Engine.Tests.ps1
          ./Tests/Transactions.Tests.ps1
          ./Tests/Performance.Tests.ps1
          powershell.exe -NoProfile -File ./Start.ps1 -Preview
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell entry point failed.' }
